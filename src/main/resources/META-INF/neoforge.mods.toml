modLoader="javafml"
loaderVersion="${loader_version_range}"
license="GNU LESSER GENERAL PUBLIC LICENSE VERSION 3"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="ParCool+ / Compatibility Addon"
description='''
An addon for ParCool, which support compatibility of animation with some mods
'''

[[mixins]]
config="parcool_compat_addon.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="parcool"
type="required"
versionRange="[${parcool_version},)"
ordering="BEFORE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="bettercombat"
type="optional"
versionRange="[3.2.2,)"
ordering="BEFORE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="carryon"
type="optional"
versionRange="[2.11.2,)"
ordering="BEFORE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="player_animation_library"
type="optional"
versionRange="[1.2.9,)"
ordering="BEFORE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="entity_texture_features"
type="optional"
versionRange="[7.2.7,)"
ordering="BEFORE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="entity_model_features"
type="optional"
versionRange="[3.3.12,)"
ordering="BEFORE"
side="CLIENT"
