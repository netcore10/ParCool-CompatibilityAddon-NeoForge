pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    // Enables Gradle to auto-download the required Java toolchain (Java 25 for Minecraft 26.x)
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

dependencyResolutionManagement {
    repositories {
        mavenCentral()
        maven { url = 'https://www.cursemaven.com' }
        maven { url = 'https://api.modrinth.com/maven' }
    }
}

rootProject.name = "ParCool-CompatibilityAddon"

