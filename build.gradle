plugins {
    id 'java'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
}

group = project.group
version = "${minecraft_version}-${parcool_version}-${mod_version}"

base {
    archivesName = 'ParCool-CompatibilityAddon'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

repositories {
    mavenCentral()
    maven { url = 'https://api.modrinth.com/maven' }
}

neoForge {
    version = neo_version
    validateAccessTransformers = true

    runs {
        client {
            client()
        }
        server { server() }
        gameTestServer { type = "gameTestServer" }

        configureEach {
            // The dependency mods still use logoFile; NeoForge shows a blocking warning screen for that in dev runs only
            systemProperty "neoforge.warnings.logofile.hide", "true"
        }
    }

    mods {
        parcool_compat_addon {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    compileOnly files(parcool_jar)
    runtimeOnly files(parcool_jar)

    compileOnly "maven.modrinth:better-combat:${bettercombat_modrinth_version}"
    runtimeOnly "maven.modrinth:better-combat:${bettercombat_modrinth_version}"
    compileOnly "maven.modrinth:player-animation-library:${pal_modrinth_version}"
    runtimeOnly "maven.modrinth:player-animation-library:${pal_modrinth_version}"
    compileOnly "maven.modrinth:carry-on:${carryon_modrinth_version}"
    runtimeOnly "maven.modrinth:carry-on:${carryon_modrinth_version}"
    compileOnly "maven.modrinth:cloth-config:${clothconfig_modrinth_version}"
    runtimeOnly "maven.modrinth:cloth-config:${clothconfig_modrinth_version}"
    compileOnly "maven.modrinth:entity-model-features:${emf_modrinth_version}"
    compileOnly "maven.modrinth:entitytexturefeatures:${etf_modrinth_version}"
    // Dev-run only (not packaged): lets the EMF render-scope mixins load in runClient
    runtimeOnly "maven.modrinth:entity-model-features:${emf_modrinth_version}"
    runtimeOnly "maven.modrinth:entitytexturefeatures:${etf_modrinth_version}"
}

processResources {
    def replaceProperties = [
            mod_id               : mod_id,
            mod_version          : mod_version,
            loader_version_range : loader_version_range,
            neo_version_range    : neo_version_range,
            minecraft_version_range: minecraft_version_range,
            parcool_version      : parcool_version
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : "ParCool Compatibility Addon",
                "Specification-Vendor"    : author,
                "Specification-Version"   : mod_version,
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : mod_version,
                "Implementation-Vendor"   : author
        ])
    }
}
